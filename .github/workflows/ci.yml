name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          FORCE_SEEDED_DEMO: "true"
          THUNDER_ENABLE_FALLBACK: "true"

  # Optional smoke: build only (Playwright needs a running server + browsers;
  # full e2e stays local / manual unless secrets-free smoke is added later).
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FORCE_SEEDED_DEMO: "true"
          THUNDER_ENABLE_FALLBACK: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
