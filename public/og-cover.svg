      <stop offset="0%" stop-color="#07101c"/>
      <stop offset="55%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#0a2438"/>
    </linearGradient>
    <linearGradient id="hammer" x1="200" y1="220" x2="820" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bolt" x1="480" y1="120" x2="620" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
