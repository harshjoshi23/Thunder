  <path d="M284 280h452v56H284V280Z" fill="#a5f3fc" opacity="0.35"/>
  <!-- Handle -->
  <path d="M460 500h104v300c0 28-22 52-52 52h0c-28 0-52-24-52-52V500Z" fill="#94a3b8"/>
  <path d="M476 780h72v56h-72v-56Z" fill="#64748b"/>
