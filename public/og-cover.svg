  <text x="72" y="160" fill="#e8eef6" font-family="Georgia, serif" font-size="78" font-weight="700">Thunder</text>
  <text x="72" y="230" fill="#67e8f9" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30">Test before you publish</text>
  <text x="72" y="940" fill="#cbd5e1" font-family="Georgia, serif" font-size="36">Audience-grounded scenario lab</text>
