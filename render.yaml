services:
  - type: web
    name: thunder
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: FORCE_MOCK
        value: "false"
      - key: ANALYZE_TIMEOUT_MS
        value: "45000"
      - key: FAL_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
