# Thunder — Render Blueprint v1 (one Next.js web service)
version: "1"
services:
  - type: web
    name: thunder
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: THUNDER_ENABLE_FALLBACK
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: "Thunder"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_AUDIENCE_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_JUROR_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_CRITIC_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_STRATEGY_MODEL
        value: "gpt-4o-mini"
      - key: FAL_KEY
        sync: false
      - key: FAL_TEXT_ENDPOINT
        value: "fal-ai/any-llm"
      - key: FAL_AUDIENCE_MODEL
        value: "google/gemini-2.5-flash-lite"
      - key: FAL_JUROR_MODEL
        value: "google/gemini-2.5-flash"
      - key: FAL_CRITIC_MODEL
        value: "anthropic/claude-3-5-haiku"
      - key: FAL_STRATEGY_MODEL
        value: "google/gemini-2.5-flash"
      - key: FAL_IMAGE_MODEL
        value: "fal-ai/flux/dev"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: "eleven_multilingual_v2"
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_API_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: ANALYZE_TIMEOUT_MS
        value: "90000"
      - key: THUNDER_RATE_LIMIT
        value: "8"
      - key: THUNDER_RATE_WINDOW_MS
        value: "3600000"
      - key: FORCE_SEEDED_DEMO
        value: "false"
      # Optional Redis / auth / monitoring — set in dashboard (do not commit secrets)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: THUNDER_API_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Optional Studio — Postgres + Stripe (set in dashboard)
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CREATOR_PRO
        sync: false
      # Optional media object storage (local .data/exports fallback)
      - key: MEDIA_EXPORT_DIR
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
